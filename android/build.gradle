buildscript {
    ext.kotlin_version = "2.4.21"

    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

// AGP 9 compiles Kotlin itself (built-in Kotlin), so there is no separate
// kotlin-android plugin; the Compose compiler ships with Kotlin 2.x as a plugin.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    def androidApiLevel = providers.gradleProperty("androidApiLevel").get().toInteger()
    def androidCompileSdk = providers.gradleProperty("androidCompileSdk").get().tokenize('.')*.toInteger()

    ndkVersion "23.1.7779620"
    compileSdk {
        version = release(androidCompileSdk[0]) {
            minorApiLevel = androidCompileSdk.size() > 1 ? androidCompileSdk[1] : 0
        }
    }
    defaultConfig {
        applicationId "com.tailscale.ipn.multiproxy"
        minSdk 26
        targetSdk androidApiLevel

        // VERSION_CODE_BASE is minutes since the Unix epoch, times 10. The
        // final digit is reserved for the platform: 0 for phone/tablet and 1
        // for Android TV. Release builds pass VERSION_CODE_BASE from the
        // Makefile so both variants share the same base. Other builds fall
        // back to the current time so local/debug Gradle invocations continue
        // to work without extra arguments.
        versionCode computeVersionCode()
        versionName getVersionProperty("VERSION_LONG")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // This setting, which defaults to 'true', will cause Tailscale to fall
        // back to the Google DNS servers if it cannot determine what the
        // operating system's DNS configuration is.
        //
        // Set it to false either here or in your local.properties file to
        // disable this behaviour.
        buildConfigField "boolean", "USE_GOOGLE_DNS_FALLBACK", getLocalProperty("tailscale.useGoogleDnsFallback", "true")

        // Development builds (-PdevTools; the CI job for pushes to main sets
        // it) can be updated through remote control (app.update), with the
        // install permissions in src/devTools/AndroidManifest.xml. Releases
        // never set it. The "-dev" version suffix keeps a dev build from
        // being mistaken for a release.
        buildConfigField "boolean", "DEV_TOOLS", isDevToolsBuild().toString()
        if (isDevToolsBuild()) {
            versionNameSuffix "-dev"
        }

        // Opt-in single-ABI filter for local test builds only (e.g. `-PtestAbi=x86_64`
        // to build/install fast against an x86_64 emulator instead of shipping all
        // four ABIs' native libs). Unset by default so normal builds are unaffected.
        if (project.hasProperty("testAbi")) {
            ndk {
                abiFilters project.property("testAbi")
            }
        }
    }

    // Per-ABI APKs plus a universal one, as published on GitHub releases.
    // Opt-in (-PsplitAbis) so ordinary builds still produce the single
    // android-debug.apk / android-release.apk the Makefile expects.
    if (project.hasProperty("splitAbis")) {
        splits {
            abi {
                enable true
                reset()
                include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
                universalApk true
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        warningsAsErrors true
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    namespace 'com.tailscale.ipn'

    buildTypes {
        applicationTest {
            initWith debug
            manifestPlaceholders.leanbackRequired = isTV()
            buildConfigField "String", "GITHUB_USERNAME", "\"" + getLocalProperty("githubUsername", "")+"\""
            buildConfigField "String", "GITHUB_PASSWORD", "\"" + getLocalProperty("githubPassword", "")+"\""
            buildConfigField "String", "GITHUB_2FA_SECRET", "\"" + getLocalProperty("github2FASecret", "")+"\""
        }
        debug {
            manifestPlaceholders.leanbackRequired = isTV()
        }
        release {
            manifestPlaceholders.leanbackRequired = isTV()

            minifyEnabled true

            shrinkResources true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    // Release signing. Credentials never live in the repo: CI passes them in
    // the environment (see .github/workflows/release.yml) and local builds
    // read a properties file outside the tree. When either is present every
    // build type is signed with the release key, so a locally built debug APK
    // installs over a released one without uninstalling (and losing app
    // data). With neither, builds fall back to the debug key as before.
    def signing = releaseSigningProperties()
    if (signing != null) {
        signingConfigs {
            tailmeshRelease {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
        buildTypes.each { it.signingConfig signingConfigs.tailmeshRelease }
    }

    testBuildType "applicationTest"

    testOptions {
        unitTests {
            // Robolectric tests need real (merged) resources and a real
            // android.jar, rather than the stubbed one the default unit-test
            // runtime uses. See android/src/test/resources/robolectric.properties
            // for the pinned test SDK.
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Android dependencies.
    implementation "androidx.core:core:1.19.1"
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation "androidx.browser:browser:1.10.0"
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "androidx.work:work-runtime:2.12.0"
    implementation "androidx.work:work-runtime-ktx:2.12.0"

    // Kotlin dependencies.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation 'junit:junit:4.13.2'
    implementation 'androidx.room:room-ktx:2.8.5'
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    // Compose dependencies.
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "com.google.accompanist:accompanist-permissions:0.37.3"
    // Final release; the library is deprecated. Replacing it changes status-bar
    // handling under edge-to-edge, which deserves its own change.
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.36.0"
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "androidx.compose.animation:animation"

    // Navigation dependencies.
    def nav_version = "2.10.2"
    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Supporting libraries.
    implementation("io.coil-kt:coil-compose:2.7.0")
    implementation("com.google.zxing:core:3.5.4")
    implementation("com.patrykandpatrick.vico:compose:3.3.1")
    implementation("com.patrykandpatrick.vico:compose-m3:3.3.1")

    // Tailscale dependencies.
    implementation ':libtailscale@aar'

    // Integration Tests
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.test.uiautomator:uiautomator:2.4.0'

    // Authentication only for tests
    androidTestImplementation 'dev.turingcomplete:kotlin-onetimepassword:2.4.0'
    androidTestImplementation 'commons-codec:commons-codec:1.16.1'

    // Unit Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    // Host tests for Android-framework logic (SQLite repositories, LinkProperties
    // route parsing, ViewModels) without an emulator.
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'

    debugImplementation("androidx.compose.ui:ui-tooling")
    implementation("androidx.compose.ui:ui-tooling-preview")
}

// ktfmtCheck / ktfmtFormat run ktfmt 0.47, the release this codebase is
// formatted with, directly. The ktfmt Gradle plugin was dropped: the version
// that supports AGP 9's built-in Kotlin bundles a newer ktfmt whose style
// differs (trailing-comma management, trailing-lambda layout) and would
// reformat most of the tree, and it cannot run the older formatter.
configurations {
    ktfmtCli
}

dependencies {
    ktfmtCli "com.facebook:ktfmt:0.47"
}

def ktfmtTask(String name, String description, List<String> flags) {
    tasks.register(name, JavaExec) {
        group = "formatting"
        setDescription(description)
        classpath = configurations.ktfmtCli
        mainClass = "com.facebook.ktfmt.cli.Main"
        def sources = fileTree("src") { include "**/*.kt" }
        inputs.files(sources)
        doFirst {
            args(flags + sources.files.collect { it.path }.sort())
        }
    }
}

ktfmtTask("ktfmtCheck", "Fails if any Kotlin source is not ktfmt-formatted.",
        ["--dry-run", "--set-exit-if-changed"])
ktfmtTask("ktfmtFormat", "Formats all Kotlin sources with ktfmt.", [])

def getLocalProperty(key, defaultValue) {
    try {
        Properties properties = new Properties()
        properties.load(project.file('local.properties').newDataInputStream())
        return properties.getProperty(key) ?: defaultValue
    } catch(Throwable ignored) {
        return defaultValue
    }
}


// releaseSigningProperties returns the release keystore and its credentials,
// or null when none are configured. Sources, first match wins:
//   1. TAILMESH_KEYSTORE + TAILMESH_KEYSTORE_PASSWORD (+ optional
//      TAILMESH_KEY_ALIAS, TAILMESH_KEY_PASSWORD) in the environment;
//   2. a properties file at $TAILMESH_SIGNING_PROPERTIES, defaulting to
//      ~/.config/tailmesh/signing.properties, with keys storeFile,
//      storePassword, keyAlias, keyPassword.
// keyAlias defaults to "tailmesh" and keyPassword to the store password.
def releaseSigningProperties() {
    def env = System.getenv()
    def result = null
    if (env.TAILMESH_KEYSTORE && env.TAILMESH_KEYSTORE_PASSWORD) {
        result = [
                storeFile    : env.TAILMESH_KEYSTORE,
                storePassword: env.TAILMESH_KEYSTORE_PASSWORD,
                keyAlias     : env.TAILMESH_KEY_ALIAS,
                keyPassword  : env.TAILMESH_KEY_PASSWORD,
        ]
    } else {
        def path = env.TAILMESH_SIGNING_PROPERTIES ?:
                "${System.getProperty('user.home')}/.config/tailmesh/signing.properties"
        def f = new File(path)
        if (!f.isFile()) {
            return null
        }
        def props = new Properties()
        f.withInputStream { props.load(it) }
        if (!props.storeFile || !props.storePassword) {
            throw new GradleException("${path} must set storeFile and storePassword")
        }
        result = [
                storeFile    : props.storeFile,
                storePassword: props.storePassword,
                keyAlias     : props.keyAlias,
                keyPassword  : props.keyPassword,
        ]
    }
    result.keyAlias = result.keyAlias ?: "tailmesh"
    result.keyPassword = result.keyPassword ?: result.storePassword
    if (!new File(result.storeFile).isFile()) {
        throw new GradleException("Release keystore not found at ${result.storeFile}")
    }
    return result
}

def getVersionProperty(key) {
    // tailscale.version is created / updated by the makefile, it is in a loosely
    // Makfile/envfile format, which is also loosely a properties file format.
    //      make tailscale.version
    def versionProps = new Properties()
    versionProps.load(project.file('../tailscale.version').newDataInputStream())
    return versionProps.getProperty(key).replaceAll('^"|"$', '')
}

def computeVersionCode() {
    def baseProperty = project.findProperty('VERSION_CODE_BASE')

    // Direct/local Gradle invocations may not come through the Makefile. Keep
    // those builds working by deriving a monotonic base from wall-clock time.
    def base = baseProperty != null
            ? baseProperty as long
            : (System.currentTimeMillis() / 60000L) * 10L

    // 0 for Android, 1 for Android TV. This keeps the two binaries distinguishable
    // in the Play Store while sharing a release base.
    def platform = isTV() ? 1 : 0

    return (base + platform) as int
}

def isDevToolsBuild() {
    return project.hasProperty('devTools')
}

def isTV() {
    return project.findProperty('PLATFORM')?.toString() == 'tv'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (isDevToolsBuild()) {
            variant.sources.manifests.addStaticManifestFile("src/devTools/AndroidManifest.xml")
        }
    }
}
