# targetSdk: the runtime behaviour the app opts in to.
androidApiLevel=36
# compileSdk, as the SDK platform's version: current AndroidX and Compose need
# at least 37 to compile against. Raising it changes no runtime behaviour.
androidCompileSdk=37.0
androidBuildToolsVersion=36.0.0
android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
