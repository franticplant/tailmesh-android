name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches
  workflow_dispatch:
    inputs:
      core-ref:
        description: franticplant/tailscale ref to build against
        default: tailmesh-android-base

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          core-ref: ${{ inputs.core-ref || 'tailmesh-android-base' }}

      - name: Go tests
        run: make go-test

      # The race detector on the concurrency-heavy packages: the dataplane
      # engine and the remote-control server.
      - name: Go race tests
        run: ./tool/go test -race ./libtailscale/multiproxy/... ./libtailscale/remotectl/...

      - name: go vet
        run: ./tool/go vet $(./tool/go list ./... | grep -v '^github.com/tailscale/tailscale-android/libtailscale$')

  android:
    name: Build and test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mkversion derives the version from history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          core-ref: ${{ inputs.core-ref || 'tailmesh-android-base' }}

      - name: Format check (ktfmt)
        run: make fmt-check

      # Builds the AAR and debug APK; the debug APK target also runs the
      # Robolectric/JVM unit tests (./gradlew test assembleDebug).
      - name: Build debug APK and run unit tests
        run: make tailscale-debug.apk

      # A release-configuration APK (no -PdevTools, R8 as in a release;
      # unsigned), checked for development-only features: the same check
      # release.yml runs before publishing.
      - name: Build release-config APK
        run: (cd android && ./gradlew assembleRelease)

      - name: Check release-config APK has no dev-only features
        run: scripts/check-release-apk.sh android/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailmesh-debug-${{ github.sha }}
          path: tailscale-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ github.sha }}
          path: android/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        run: |
          {
            echo "### Debug build"
            echo "- core: \`franticplant/tailscale@${{ steps.setup.outputs.core-sha }}\`"
            echo "- APK: \`$(du -h tailscale-debug.apk | cut -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Development APKs of every push to main: signed with the release key, so
  # they install over the released app keeping its data, and built with
  # DEV_TOOLS (remote app updates, "-dev" version name), so they are never
  # mistaken for a release. Pull requests (Dependabot's included) never reach
  # this job, and the "release" environment, which holds the signing
  # secrets, only admits main and v* tags.
  signed-apk:
    name: Build signed dev APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[ci skip]')
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        id: setup

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAILMESH_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tailmesh-release.jks"
          echo "TAILMESH_KEYSTORE=$RUNNER_TEMP/tailmesh-release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          TAILMESH_KEYSTORE_PASSWORD: ${{ secrets.TAILMESH_KEYSTORE_PASSWORD }}
          TAILMESH_KEY_PASSWORD: ${{ secrets.TAILMESH_KEY_PASSWORD }}
          TAILMESH_KEY_ALIAS: ${{ vars.TAILMESH_KEY_ALIAS }}
        run: make release-apks DEV_TOOLS=1 RELEASE_TAG="dev-${GITHUB_SHA::9}"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tailmesh-release.jks"

      # The inverse of the release check: it must still recognise every
      # dev-only piece here, or it would pass releases without looking.
      - name: Check the release check still sees dev builds
        run: scripts/check-release-apk.sh --expect-dev dist/*.apk

      - name: Verify signatures
        env:
          EXPECTED: ${{ vars.TAILMESH_CERT_SHA256 }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in dist/*.apk; do
            got=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            echo "$apk: $got"
            if [[ -n "$EXPECTED" && "${got,,}" != "${EXPECTED,,}" ]]; then
              echo "::error::$apk is signed by $got, expected $EXPECTED"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailmesh-dev-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Development build"
            echo "Signed with the release key, so it installs over the released app keeping its data."
            echo "Not a release: remote app updates are enabled and the version name ends in -dev."
            echo "- core: \`franticplant/tailscale@${{ steps.setup.outputs.core-sha }}\`"
            (cd dist && sha256sum *.apk | sed 's/^/- /')
          } >> "$GITHUB_STEP_SUMMARY"
