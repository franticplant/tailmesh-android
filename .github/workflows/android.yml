name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches
  workflow_dispatch:
    inputs:
      core-ref:
        description: franticplant/tailscale ref to build against
        default: tailmesh-android-base

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          core-ref: ${{ inputs.core-ref || 'tailmesh-android-base' }}

      - name: Go tests
        run: make go-test

      # The race detector on the concurrency-heavy packages: the dataplane
      # engine and the remote-control server.
      - name: Go race tests
        run: ./tool/go test -race ./libtailscale/multiproxy/... ./libtailscale/remotectl/...

      - name: go vet
        run: ./tool/go vet $(./tool/go list ./... | grep -v '^github.com/tailscale/tailscale-android/libtailscale$')

  android:
    name: Build and test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mkversion derives the version from history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          core-ref: ${{ inputs.core-ref || 'tailmesh-android-base' }}

      - name: Format check (ktfmt)
        run: make fmt-check

      # Builds the AAR and debug APK; the debug APK target also runs the
      # Robolectric/JVM unit tests (./gradlew test assembleDebug).
      - name: Build debug APK and run unit tests
        run: make tailscale-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailmesh-debug-${{ github.sha }}
          path: tailscale-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ github.sha }}
          path: android/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        run: |
          {
            echo "### Debug build"
            echo "- core: \`franticplant/tailscale@${{ steps.setup.outputs.core-sha }}\`"
            echo "- APK: \`$(du -h tailscale-debug.apk | cut -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
