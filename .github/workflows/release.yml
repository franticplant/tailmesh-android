name: Release

# Builds signed release APKs (per ABI plus universal) and the tailmesh-ctl CLI,
# attests them (SLSA build provenance and an SPDX SBOM, via Sigstore) and
# publishes them as a GitHub release. Anyone can check a download with:
#   gh attestation verify <file> -R franticplant/tailmesh-android
#
# Builds are reproducible. Alongside publishing, a second runner rebuilds the
# APKs from source in a different directory and checks they match the signed
# ones byte for byte (apart from the signature); a mismatch fails that job but
# does not hold the release back. Anyone can repeat the check with
# scripts/verify-reproducible.sh <tag>.
#
# Triggered by pushing a tag like v0.4.0, or manually for an existing tag.
# Tags with a suffix (v0.4.0-rc1) and every v0.x release are marked
# pre-release, matching earlier releases.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAILMESH_KEYSTORE_BASE64    base64 of the release .jks
#   TAILMESH_KEYSTORE_PASSWORD  keystore password
#   TAILMESH_KEY_PASSWORD       key password (optional; defaults to the store password)
# Optional repository variables:
#   TAILMESH_KEY_ALIAS          key alias (default: tailmesh)
#   TAILMESH_CERT_SHA256        expected signing certificate SHA-256 (hex); the
#                               build fails if the APKs are signed by anything else
#
# The secrets are only exposed to the "release" environment; protect it with
# required reviewers or a tag rule to gate who can publish.
#
# Release notes come from docs/release-notes/<tag>.md at the tag, so write
# that before tagging; without it, GitHub's generated notes (merged PRs only)
# are used. Build and verification details are appended either way.
#
# Works with immutable releases: a new release is created with all its assets
# at once, and only a still-draft release is ever updated.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.4.0)
        required: true
      core-ref:
        description: franticplant/tailscale ref to build against
        default: tailmesh-android-base

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for attestations
      attestations: write
    outputs:
      core-sha: ${{ steps.setup.outputs.core-sha }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Taken from the pristine checkout, before the core is placed beside it
      # and build outputs appear: Go modules from go.mod/go.sum, Gradle
      # dependencies as far as syft can read them from the build scripts.
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: ./.github/actions/setup-build
        id: setup
        with:
          core-ref: ${{ inputs.core-ref || 'tailmesh-android-base' }}

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Go tests
        run: make go-test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAILMESH_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::TAILMESH_KEYSTORE_BASE64 is not set; see the header of this workflow."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tailmesh-release.jks"
          echo "TAILMESH_KEYSTORE=$RUNNER_TEMP/tailmesh-release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          TAILMESH_KEYSTORE_PASSWORD: ${{ secrets.TAILMESH_KEYSTORE_PASSWORD }}
          TAILMESH_KEY_PASSWORD: ${{ secrets.TAILMESH_KEY_PASSWORD }}
          TAILMESH_KEY_ALIAS: ${{ vars.TAILMESH_KEY_ALIAS }}
          RELEASE_TAG: ${{ env.TAG }}
        run: make release-apks

      - name: Check no dev-only features
        run: scripts/check-release-apk.sh dist/*.apk

      - name: Verify signatures
        env:
          EXPECTED: ${{ vars.TAILMESH_CERT_SHA256 }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            got=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
            echo "$apk: $got"
            if [[ -n "$EXPECTED" && "${got,,}" != "${EXPECTED,,}" ]]; then
              echo "::error::$apk is signed by $got, expected $EXPECTED"
              exit 1
            fi
          done

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tailmesh-release.jks"

      - name: Build tailmesh-ctl
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [[ $os == windows ]] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch ./tool/go build -trimpath -ldflags="-s -buildid=" \
              -o "dist/tailmesh-ctl-$TAG-$os-$arch$ext" ./cmd/tailmesh-ctl
          done

      - name: Checksums
        run: |
          cp "$RUNNER_TEMP/sbom.spdx.json" "dist/tailmesh-$TAG.spdx.json"
          (cd dist && sha256sum * | grep -v SHA256SUMS > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/tailmesh-${{ env.TAG }}.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  reproduce:
    name: Check the build reproduces
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # Only for the JDK, Android SDK/NDK and Go toolchain; the script clones
      # both repositories again itself.
      - uses: ./.github/actions/setup-build
        with:
          core-ref: ${{ needs.build.outputs.core-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.TAG }}
          path: ${{ runner.temp }}/official

      - name: Rebuild and compare
        env:
          CORE_SHA: ${{ needs.build.outputs.core-sha }}
          WORK_DIR: ${{ runner.temp }}/reproduce
        run: |
          pip install --quiet apksigcopier==1.1.1
          scripts/verify-reproducible.sh "$TAG" "$RUNNER_TEMP/official"

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: docs/release-notes
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist

      # The artifact round-trip must not have changed anything that was attested.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          for f in dist/*; do
            [[ $(basename "$f") == SHA256SUMS ]] && continue
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
            echo "verified: $f"
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORE_SHA: ${{ needs.build.outputs.core-sha }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* || "$TAG" == v0.* ]]; then prerelease="--prerelease"; fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ $draft != true ]]; then
              echo "::error::$TAG is already published; releases are immutable. Cut a new tag."
              exit 1
            fi
            # A draft written by hand keeps its notes; only assets are replaced.
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > generated.md
          if [[ -f "docs/release-notes/$TAG.md" ]]; then
            # Hand-written notes, plus the generated "Full Changelog" link.
            { cat "docs/release-notes/$TAG.md"; echo; grep -m1 'Full Changelog' generated.md || true; } > notes.md
          else
            echo "::warning::docs/release-notes/$TAG.md not found; using GitHub's generated notes."
            mv generated.md notes.md
          fi
          {
            echo
            echo "---"
            echo "Built by GitHub Actions from \`$BUILD_SHA\` against patched core" \
              "\`franticplant/tailscale@$CORE_SHA\`."
            echo
            echo "Every file has a signed build-provenance and SBOM attestation. To verify a download:"
            echo
            echo "    gh attestation verify <file> -R $GH_REPO"
            echo
            echo "or compare it against \`SHA256SUMS\`. The build is reproducible:"
            echo "\`scripts/verify-reproducible.sh $TAG\` rebuilds these APKs from source and checks they match."
          } >> notes.md
          gh release create "$TAG" dist/* $prerelease --verify-tag --title "$TAG" --notes-file notes.md
