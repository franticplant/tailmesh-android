name: go mod tidy

on:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-go-mod-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out patched Tailscale core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: franticplant/tailscale
          ref: tailmesh-android-base
          path: tailscale-core
          persist-credentials: false

      - name: Place patched core as a workspace sibling
        run: mv tailscale-core ../tailscale

      - name: Cache Tailscale Go toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tailscale-go
          key: tailscale-go-${{ runner.os }}-${{ hashFiles('go.toolchain.rev') }}

      - name: Check 'go mod tidy' is clean
        run: |
          ./tool/go mod tidy
          git diff --name-only --exit-code || (echo "The files above need updating. Please run 'go mod tidy'."; exit 1)
